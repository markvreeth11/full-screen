<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Share for Sunday</title><link rel="stylesheet" href="/style.css"></head>
<body class="leaves"><div class="wrap">
<h1 id="church">Share for Sunday</h1>
<p class="mute" id="week">&nbsp;</p>
<div id="gate" class="card" hidden>
  <h2>Enter the upload code</h2><p class="mute">Ask a church leader if you don't have it.</p>
  <form id="gateForm" class="row"><input class="grow" type="password" id="code" placeholder="Upload code" autocomplete="off"><button>Continue</button></form>
  <div id="gateErr" class="msg bad" hidden></div>
</div>
<div id="closed" class="msg" hidden>Uploads are closed right now. Please check back later.</div>
<div id="main" hidden>
  <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose photos or videos">
    <b>Drag &amp; drop photos or videos here</b><span class="mute">or click to choose files</span>
  </div>
  <input type="file" id="pick" accept="image/*,video/*" multiple hidden>
  <div id="list"></div>
  <div class="row" id="bar" style="margin-top:18px" hidden>
    <div class="grow"><label for="who" style="margin:0 0 4px">Your name <span class="mute">(optional)</span></label><input type="text" id="who" maxlength="80"></div>
    <button id="send" style="align-self:end">Upload</button>
  </div>
  <div id="done"></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/fit.js"></script>
<script>
const $=s=>document.querySelector(s);
const h=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a))x in e&&x!=='style'?e[x]=v:e.setAttribute(x,v);e.append(...k);return e};
const post=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
let files=[],INFO,SB,BG;
const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'long',day:'numeric'});

async function init(){
  INFO=await (await fetch('/api/info')).json();
  $('#church').textContent=INFO.churchName;document.title='Share for Sunday · '+INFO.churchName;
  document.body.style.setProperty('--bgimg',`url(${INFO.bg})`);
  $('#week').textContent=`Upload for the week of ${fmt(INFO.range.start)} – ${fmt(INFO.range.end)}. Everything you add is shown on the screen this week, then deleted automatically.`;
  $('#gate').hidden=!INFO.needsCode;$('#closed').hidden=INFO.needsCode||INFO.uploadsOpen;$('#main').hidden=INFO.needsCode||!INFO.uploadsOpen;
  SB=supabase.createClient(INFO.supabaseUrl,INFO.supabaseKey||'none',{auth:{persistSession:false}});
}
$('#gateForm').onsubmit=async e=>{e.preventDefault();
  const r=await post('/api/code',{code:$('#code').value});
  if(r.ok)init();else{$('#gateErr').hidden=false;$('#gateErr').textContent=(await r.json()).error}};

const drop=$('#drop');
drop.onclick=()=>$('#pick').click();drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#pick').click()}};
$('#pick').onchange=e=>{add(e.target.files);e.target.value=''};
['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',e=>add(e.dataTransfer.files));
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>e.preventDefault());

function add(fl){
  for(const f of fl){
    const kind=f.type.startsWith('image/')?'image':f.type.startsWith('video/')?'video':null;
    if(!kind){alert(`"${f.name}" isn't a photo or video, so it was skipped.`);continue}
    const max=kind==='video'?INFO.maxVideoMB:INFO.maxImageMB;
    if(f.size>max*1048576){alert(`"${f.name}" is ${Math.round(f.size/1048576)} MB. The limit for ${kind}s is ${max} MB.`);continue}
    const url=URL.createObjectURL(f);
    const st=h('div',{className:'small mute'},f.name);
    let pv;
    if(kind==='video'){pv=h('video',{className:'pv',src:url+'#t=0.5',muted:true,preload:'metadata'});
      pv.onerror=()=>{st.textContent='⚠ This video format may not play on the screen. Please export it as MP4 (H.264) and upload that instead.';st.style.color='var(--bad)'}}
    else pv=h('img',{className:'pv',src:url,alt:''});
    const title=h('input',{type:'text',maxLength:120,placeholder:'Title (optional)'});
    const desc=h('textarea',{maxLength:400,placeholder:'Short description (optional)'});
    const bar=h('i'),prog=h('div',{className:'bar',hidden:true},bar);
    const rm=h('button',{className:'ghost sm',type:'button',onclick:()=>{o.row.remove();files=files.filter(x=>x!==o);sync()}},'Remove');
    const row=h('div',{className:'card file'},pv,h('div',{},h('label',{},'Title'),title,h('label',{},'Description'),desc,prog,st),rm);
    const o={f,kind,title,desc,bar,prog,st,row,rm};files.push(o);$('#list').append(row);
  }sync();
}
function sync(){const n=files.filter(o=>!o.done).length;$('#bar').hidden=!files.length;$('#send').hidden=!n;$('#send').textContent=n>1?`Upload ${n} files`:'Upload'}

const fail=(o,m)=>{o.st.textContent='Failed: '+m;o.st.style.color='var(--bad)';o.prog.hidden=true;o.rm.hidden=false;o.title.disabled=o.desc.disabled=false};
async function upload(o){
  o.rm.hidden=true;o.title.disabled=o.desc.disabled=true;o.st.style.color='';o.prog.hidden=false;o.bar.style.width='15%';
  try{
    let blob=o.f,meta={},ext=(o.f.name.split('.').pop()||'').toLowerCase();
    if(o.kind==='image'){
      o.st.textContent='Preparing image for the screen…';
      BG=BG||await Fit.loadBg(INFO.bg);
      const r=await Fit.fitImage(o.f,BG);blob=r.blob;meta={srcW:r.srcW,srcH:r.srcH,fullFrame:r.fullFrame,outExt:r.ext};
    }
    o.bar.style.width='35%';o.st.textContent='Uploading…';
    const s=await post('/api/upload',{action:'sign',kind:o.kind,ext,outExt:meta.outExt,size:o.f.size});
    const sj=await s.json();if(!s.ok)throw new Error(sj.error||'Could not start upload');
    // images: [original, fitted]; videos: [video]
    const bodies=o.kind==='image'?[o.f,blob]:[o.f];
    for(let i=0;i<sj.uploads.length;i++){
      const u=sj.uploads[i];
      const {error}=await SB.storage.from(u.bucket).uploadToSignedUrl(u.path,u.token,bodies[i],{contentType:bodies[i].type||undefined});
      if(error)throw new Error(error.message||'Upload failed');
      o.bar.style.width=(35+(i+1)/sj.uploads.length*55)+'%';
    }
    const d=await post('/api/upload',{action:'done',ticket:sj.ticket,title:o.title.value,description:o.desc.value,uploader:$('#who').value,originalName:o.f.name,...meta});
    const dj=await d.json();if(!d.ok)throw new Error(dj.error||'Could not finish upload');
    o.bar.style.width='100%';o.done=true;o.st.textContent='On the screen this week ✓';o.st.style.color='var(--ok)';
    return true;
  }catch(e){fail(o,e.message||'upload error');return false}
}
$('#send').onclick=async()=>{
  $('#send').disabled=true;let ok=0;
  for(const o of files.filter(o=>!o.done)){if(await upload(o))ok++}
  $('#send').disabled=false;sync();
  if(ok)$('#done').replaceChildren(h('div',{className:'msg'},`Thank you! ${ok} file${ok>1?'s':''} sent. They'll appear on the screen this week.`));
};
init();
</script></body></html>
