<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Share for Sunday</title><link rel="stylesheet" href="/style.css"></head>
<body class="leaves"><div class="wrap">
<h1 id="church">Share for Sunday</h1>
<p class="mute" id="week">&nbsp;</p>
<div id="gate" class="card" hidden>
  <h2>Enter the upload code</h2><p class="mute">Ask a church leader if you don't have it.</p>
  <form id="gateForm" class="row"><input class="grow" type="password" id="code" placeholder="Upload code" autocomplete="off"><button>Continue</button></form>
  <div id="gateErr" class="msg bad" hidden></div>
</div>
<div id="closed" class="msg" hidden>Uploads are closed right now. Please check back later.</div>
<div id="main" hidden>
  <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose photos or videos">
    <b>Drag &amp; drop photos or videos here</b><span class="mute">or click to choose files</span>
  </div>
  <input type="file" id="pick" accept="image/*,video/*" multiple hidden>
  <div id="list"></div>
  <div class="row" id="bar" style="margin-top:18px" hidden>
    <div class="grow"><label for="who" style="margin:0 0 4px">Your name <span class="mute">(optional)</span></label><input type="text" id="who" maxlength="80"></div>
    <button id="send" style="align-self:end">Upload</button>
  </div>
  <div id="done"></div>
</div></div>
<script>
const $=s=>document.querySelector(s);
const h=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a))x in e&&x!=='style'?e[x]=v:e.setAttribute(x,v);e.append(...k);return e};
let files=[];
const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'long',day:'numeric'});

async function init(){
  const i=await (await fetch('/api/public/info')).json();
  $('#church').textContent=i.churchName;document.title='Share for Sunday · '+i.churchName;
  document.body.style.setProperty('--bgimg',`url(${i.bg})`);
  $('#week').textContent=`Upload for the week of ${fmt(i.range.start)} – ${fmt(i.range.end)}. Everything you add is shown on the screen this week, then cleared automatically.`;
  $('#gate').hidden=!i.needsCode;$('#closed').hidden=i.needsCode||i.uploadsOpen;$('#main').hidden=i.needsCode||!i.uploadsOpen;
  window.maxMB=i.maxUploadMB;
}
$('#gateForm').onsubmit=async e=>{e.preventDefault();
  const r=await fetch('/api/public/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('#code').value})});
  if(r.ok)init();else{$('#gateErr').hidden=false;$('#gateErr').textContent=(await r.json()).error}};

const drop=$('#drop');
drop.onclick=()=>$('#pick').click();drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#pick').click()}};
$('#pick').onchange=e=>{add(e.target.files);e.target.value=''};
['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',e=>add(e.dataTransfer.files));
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>e.preventDefault());

function add(fl){
  for(const f of fl){
    if(!/^(image|video)\//.test(f.type)){alert(`"${f.name}" isn't a photo or video, so it was skipped.`);continue}
    if(f.size>window.maxMB*1048576){alert(`"${f.name}" is larger than ${window.maxMB} MB.`);continue}
    const url=URL.createObjectURL(f);
    const pv=f.type.startsWith('video/')?h('video',{className:'pv',src:url+'#t=0.5',muted:true,preload:'metadata'}):h('img',{className:'pv',src:url,alt:''});
    const title=h('input',{type:'text',maxLength:120,placeholder:'Title (optional)'});
    const desc=h('textarea',{maxLength:400,placeholder:'Short description (optional)'});
    const bar=h('i'),prog=h('div',{className:'bar',hidden:true},bar),st=h('div',{className:'small mute'},f.name);
    const rm=h('button',{className:'ghost sm',type:'button',title:'Remove',onclick:()=>{o.row.remove();files=files.filter(x=>x!==o);sync()}},'Remove');
    const row=h('div',{className:'card file'},pv,h('div',{},h('label',{},'Title'),title,h('label',{},'Description'),desc,prog,st),rm);
    const o={f,title,desc,bar,prog,st,row,rm};files.push(o);$('#list').append(row);
  }sync();
}
function sync(){const n=files.filter(o=>!o.id).length;$('#bar').hidden=!files.length;$('#send').hidden=!n;$('#send').textContent=n>1?`Upload ${n} files`:'Upload'}

function upload(o){return new Promise(res=>{
  const fd=new FormData();fd.append('title',o.title.value);fd.append('description',o.desc.value);fd.append('uploader',$('#who').value);fd.append('file',o.f);
  const x=new XMLHttpRequest();x.open('POST','/api/upload');
  o.prog.hidden=false;o.rm.hidden=true;o.title.disabled=o.desc.disabled=true;
  x.upload.onprogress=e=>{if(e.lengthComputable){o.bar.style.width=(e.loaded/e.total*100)+'%';o.st.textContent=`Uploading… ${Math.round(e.loaded/e.total*100)}%`}};
  x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch{}
    if(x.status===200){o.st.textContent='Uploaded ✓ — preparing for the screen…';o.id=j.id;res(true)}
    else{o.st.textContent='Failed: '+(j.error||'upload error');o.st.style.color='var(--bad)';o.rm.hidden=false;o.title.disabled=o.desc.disabled=false;res(false)}};
  x.onerror=()=>{o.st.textContent='Failed: network error';o.st.style.color='var(--bad)';o.rm.hidden=false;o.title.disabled=o.desc.disabled=false;res(false)};
  x.send(fd)})}

$('#send').onclick=async()=>{
  $('#send').disabled=true;let ok=0;
  for(const o of files.filter(o=>!o.id)){if(await upload(o))ok++}
  $('#send').disabled=false;sync();
  if(ok)$('#done').replaceChildren(h('div',{className:'msg'},`Thank you! ${ok} file${ok>1?'s':''} sent. They'll appear on the screen this week.`));
  trackSent();
};
async function trackSent(){
  const mine=files.filter(o=>o.id&&!o.final);if(!mine.length)return;
  const s=await (await fetch('/api/public/status?ids='+mine.map(o=>o.id).join(','))).json();
  let pending=false;
  for(const r of s){const o=mine.find(x=>x.id===r.id);if(!o)continue;
    if(r.status==='ready'){o.st.textContent='On the screen this week ✓';o.st.style.color='var(--ok)';o.final=1}
    else if(r.status==='error'){o.st.textContent='Sorry, this file could not be processed: '+(r.error||'unknown error');o.st.style.color='var(--bad)';o.final=1}
    else pending=true}
  if(pending)setTimeout(trackSent,3000);
}
init();
</script></body></html>
