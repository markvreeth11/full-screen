name: Convert videos

# Turns uploaded videos into 1920x1080 / 59.94 fps MP4 files for the admin "Download" button.
# Started by the website right after a video upload (needs GH_DISPATCH_TOKEN in Vercel), and
# once an hour as a safety net. You can also start it by hand: Actions -> Convert videos -> Run workflow.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: convert-videos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=dev
      - name: Check for videos waiting
        id: check
        run: node scripts/convert-videos.js --check
      - name: Install ffmpeg
        if: steps.check.outputs.pending != '0'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Convert
        if: steps.check.outputs.pending != '0'
        run: node scripts/convert-videos.js
